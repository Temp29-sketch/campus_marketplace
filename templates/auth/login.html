{% extends "base.html" %}
{% block title %}Log in · Campus Market{% endblock %}
{% block content %}
<div class="card">
  <h1>Log in</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">

    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email" required>

    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>

    <button class="btn full" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
