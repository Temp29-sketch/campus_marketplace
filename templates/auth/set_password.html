{% extends "base.html" %}
{% block title %}Choose a password · Campus Market{% endblock %}
{% block content %}
<div class="card">
  <h1>Almost there, {{ name }}</h1>
  <p class="muted">Your school email <strong>{{ email }}</strong> is confirmed. Choose a password to create your account.</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="password">Password</label>
    <input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required>

    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>

    <button class="btn full" type="submit">Create account</button>
  </form>
</div>
{% endblock %}
