{% extends "base.html" %}{% block title %}Forgot password · {{ app_name }}{% endblock %}{% block content %}
<div class="card"><h1>Forgot password?</h1>{% if sent %}<p>If that email has an account, we've sent a reset link.</p>{% else %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" required><button class="btn full" type="submit">Send reset link</button></form>{% endif %}</div>
{% endblock %}
